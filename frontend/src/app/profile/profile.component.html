<app-dashboard></app-dashboard>

<mat-card class="profile-card">
  <mat-card-header>
    <mat-card-title><h3>Profile Details</h3></mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="user() as user" class="profile-details">
      <p><strong>Name:</strong> {{ user.firstName }} {{ user.lastName }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Age:</strong> {{ user.age }}</p>
      <p *ngIf="user.gender"><strong>Gender:</strong> {{ user.gender }}</p>
    </div>
  </mat-card-content>
</mat-card>
